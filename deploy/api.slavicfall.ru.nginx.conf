server {
    server_name api.slavicfall.ru;

    location /builds/ { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8889;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 90;

    }


location = /local.php {
    root /var/www/ofapi-static;
    default_type text/plain;
}

location = /themedEvent.php {
    root /var/www/ofapi-static;
    default_type text/plain;
}

location = /rankUrl.txt {
    root /var/www/ofapi-static;
    default_type text/plain;
}

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.slavicfall.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.slavicfall.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {

listen 80;
    server_name api.slavicfall.ru;

    location /builds/ { return 404; }

    location / {
        return 301 https://$host$request_uri;
    }

location = /assetInfo.php {
    proxy_pass http://127.0.0.1:8888;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /loginInfo.php {
    proxy_pass http://127.0.0.1:8888;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /index.html {
    proxy_pass http://127.0.0.1:8888;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}


}

